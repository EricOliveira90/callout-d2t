# src/d2t/config.yaml
recipes:
  wbr_gms_callout:
    description: "WBR GMS YoY callout by product group with top seller drivers and vs-goal comparison"
    strategy: wbr_gms_yoy
    template: wbr_gms_callout
    inputs:
      - name: main
        description: "Sales data with year, product_group, seller_name, channel, program, net_ordered_gms_usd columns"
        required: true
      - name: lookup
        description: "Product group lookup table mapping numeric IDs to descriptions (e.g. PF-to-GL.csv)"
        required: false
        default_path: csv-static/PF-to-GL.csv
      - name: goals
        description: "GMS goals data with activity_day, product_group, net_ordered_gms_usd columns"
        required: false
        default_path: csv-static/op2-2026-3p-goals-gms.csv
    relations:
      - main_key: product_group
        lookup_input: lookup
        lookup_key: gl_product_group
        group_by: gl_category_description
    flags:
      - name: start-date
        description: "Start date of the analysis period (YYYY-MM-DD)"
        required: true
      - name: end-date
        description: "End date of the analysis period (YYYY-MM-DD)"
        required: true
    params:
      year_col: year
      product_group_col: product_group
      seller_name_col: seller_name
      channel_col: channel
      program_col: program
      gms_col: net_ordered_gms_usd
      period_label: Period
      lookup_group_col: gl_product_group
      lookup_desc_col: gl_category_description
      goals_activity_day_col: activity_day
      goals_product_group_col: product_group
      goals_gms_col: net_ordered_gms_usd

  wbr_gms_detailed:
    description: "WBR GMS YoY detailed breakdown — full product group × seller × channel analysis with vs-goal comparison"
    strategy: wbr_gms_yoy
    template: wbr_gms_detailed
    inputs:
      - name: main
        description: "Sales data with year, product_group, seller_name, channel, program, net_ordered_gms_usd columns"
        required: true
      - name: lookup
        description: "Product group lookup table mapping numeric IDs to descriptions (e.g. PF-to-GL.csv)"
        required: false
        default_path: csv-static/PF-to-GL.csv
      - name: goals
        description: "GMS goals data with activity_day, product_group, net_ordered_gms_usd columns"
        required: false
        default_path: csv-static/op2-2026-3p-goals-gms.csv
    relations:
      - main_key: product_group
        lookup_input: lookup
        lookup_key: gl_product_group
        group_by: gl_category_description
    flags:
      - name: start-date
        description: "Start date of the analysis period (YYYY-MM-DD)"
        required: true
      - name: end-date
        description: "End date of the analysis period (YYYY-MM-DD)"
        required: true
    params:
      year_col: year
      product_group_col: product_group
      seller_name_col: seller_name
      channel_col: channel
      program_col: program
      gms_col: net_ordered_gms_usd
      period_label: Period
      lookup_group_col: gl_product_group
      lookup_desc_col: gl_category_description
      goals_activity_day_col: activity_day
      goals_product_group_col: product_group
      goals_gms_col: net_ordered_gms_usd

  product_selection_callout:
    description: "Product Selection WoW executive callout — paragraph-style summary with top drivers/detractors and channel insights"
    strategy: product_selection_wow
    template: product_selection_callout
    inputs:
      - name: main
        description: "Product selection data with period, product_group, channel flags (is_fba, is_fbaos, is_es, is_ss), filter flags (is_dom, is_narf, mfn_ooc), and metrics (ba, awagv, awas, ftac)"
        required: true
      - name: lookup
        description: "Product group lookup table (PF-to-GL.csv) mapping gl_product_group to gl_category_description"
        required: false
        default_path: csv-static/PF-to-GL.csv
    params:
      period_col: period
      product_group_col: product_group
      is_dom_col: is_dom
      is_narf_col: is_narf
      mfn_ooc_col: mfn_ooc
      metrics: "ba,awagv,awas,ftac"
      channel_cols: "is_fba,is_fbaos,is_es,is_ss"
      channel_labels: "FBA,Seller Flex,MFN Easy Ship,MFN Self Ship"
      lookup_group_col: gl_product_group
      lookup_desc_col: gl_category_description
      top_drivers: 2
      top_detractors: 1

  product_selection_detailed:
    description: "Product Selection WoW detailed breakdown — full channel × product group matrix for all metrics"
    strategy: product_selection_wow
    template: product_selection_detailed
    inputs:
      - name: main
        description: "Product selection data with period, product_group, channel flags (is_fba, is_fbaos, is_es, is_ss), filter flags (is_dom, is_narf, mfn_ooc), and metrics (ba, awagv, awas, ftac)"
        required: true
      - name: lookup
        description: "Product group lookup table (PF-to-GL.csv) mapping gl_product_group to gl_category_description"
        required: false
        default_path: csv-static/PF-to-GL.csv
    params:
      period_col: period
      product_group_col: product_group
      is_dom_col: is_dom
      is_narf_col: is_narf
      mfn_ooc_col: mfn_ooc
      metrics: "ba,awagv,awas,ftac"
      channel_cols: "is_fba,is_fbaos,is_es,is_ss"
      channel_labels: "FBA,Seller Flex,MFN Easy Ship,MFN Self Ship"
      lookup_group_col: gl_product_group
      lookup_desc_col: gl_category_description
      top_drivers: 2
      top_detractors: 1
