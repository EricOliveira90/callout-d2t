[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d2t"
version = "0.1.0"
description = "Data-to-Text CLI: transform CSV data into natural language via Jinja2 templates"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "pyyaml>=6.0",
]

[project.scripts]
d2t = "d2t.cli:cli"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
gui = [
    "streamlit>=1.28",
]
